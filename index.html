<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>FLIP 0.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:Arial,sans-serif}#menu,#game,#over{position:fixed;inset:0}#menu,#over{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}#menu{background:radial-gradient(circle,#202020,#050505)}h1{font-size:22vw;margin:0;letter-spacing:.08em;text-shadow:4px 4px 0 #555}.sub{color:#aaa;letter-spacing:.25em;font-size:12px}button{width:min(86vw,340px);padding:17px;margin:14px 0;border:1px solid #777;border-radius:12px;background:#151515;color:#fff;font-size:18px}#game{background:#0b0b0b}#hud{position:absolute;top:18px;left:0;width:100%;display:flex;justify-content:space-around;z-index:5;font-size:13px;letter-spacing:.12em}#instruction{position:absolute;top:70px;left:0;width:100%;text-align:center;color:#aaa;font-size:13px;z-index:5}#arena{position:absolute;left:7%;right:7%;top:22%;bottom:12%;border:1px solid #333;border-radius:18px}.target{position:absolute;width:27%;height:27%;border:2px dashed #444;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#777;font-size:10px}#t0{left:4%;top:5%}#t1{right:4%;top:5%}#t2{left:4%;bottom:5%}#t3{right:4%;bottom:5%}#piece{position:absolute;width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 25px #fff3;z-index:10;touch-action:none;user-select:none}#piece.circle{border-radius:50%}#piece.triangle{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}#msg{position:absolute;bottom:3%;width:100%;text-align:center;color:#777;font-size:11px}#flash{position:absolute;inset:0;pointer-events:none;opacity:0}#flash.good{background:#fff;opacity:.12}#flash.bad{background:#f00;opacity:.2}#over{background:#050505ee;z-index:20}#over h2{font-size:12vw;margin:0 0 10px}#scoreline{font-size:24px}.hide{display:none!important}</style></head><body><section id="menu"><h1>FLIP</h1><div class="sub">0.1 • FIRST PROTOTYPE</div><p>Drag each shape into its matching target.<br>Build your multiplier. Don't make a mistake.</p><button id="start">PLAY</button><div id="best"></div></section><section id="game" class="hide"><div id="hud"><span>SCORE <b id="score">0</b></span><span>×<b id="mult">1</b></span><span>BEST <b id="best2">0</b></span></div><div id="instruction">MATCH THE SHAPE</div><div id="arena"><div class="target" id="t0">CIRCLE</div><div class="target" id="t1">SQUARE</div><div class="target" id="t2">TRIANGLE</div><div class="target" id="t3">STAR</div><div id="piece"></div></div><div id="msg">DRAG THE PIECE</div><div id="flash"></div></section><section id="over" class="hide"><h2>GAME OVER</h2><div id="scoreline">SCORE 0</div><p id="result"></p><button id="again">PLAY AGAIN</button><button id="home">MENU</button></section><script>(()=>{const $=id=>document.getElementById(id),piece=$('piece'),arena=$('arena'),flash=$('flash');let score=0,mult=1,best=Number(localStorage.getItem('flipBest')||0),current=null,dragging=false,timer=null;const shapes=[{name:'circle',label:'●',target:'t0'},{name:'square',label:'■',target:'t1'},{name:'triangle',label:'▲',target:'t2'},{name:'star',label:'★',target:'t3'}];$('best').textContent='BEST: '+best;$('best2').textContent=best;function newShape(){current=shapes[Math.floor(Math.random()*shapes.length)];piece.className='';piece.classList.add(current.name);piece.textContent=current.label;const maxX=Math.max(20,arena.clientWidth-90),maxY=Math.max(20,arena.clientHeight-90);piece.style.left=(20+Math.random()*Math.max(1,maxX-40))+'px';piece.style.top=(20+Math.random()*Math.max(1,maxY-40))+'px';piece.style.transform='none';clearTimeout(timer);timer=setTimeout(()=>{if(!dragging)fail()},Math.max(850,2600-score*32));$('msg').textContent='DRAG THE PIECE'}function startGame(){$('menu').classList.add('hide');$('over').classList.add('hide');$('game').classList.remove('hide');score=0;mult=1;$('score').textContent=0;$('mult').textContent=1;$('best2').textContent=best;newShape()}function flashIt(type){flash.className='';void flash.offsetWidth;flash.className=type;setTimeout(()=>flash.className='',130)}function inTarget(){const pr=piece.getBoundingClientRect(),tr=$(current.target).getBoundingClientRect(),px=pr.left+pr.width/2,py=pr.top+pr.height/2;return px>tr.left&&px<tr.right&&py>tr.top&&py<tr.bottom}function success(){clearTimeout(timer);score++;if(score%5===0)mult++;$('score').textContent=score;$('mult').textContent=mult;if(score>best){best=score;localStorage.setItem('flipBest',best);$('best2').textContent=best}$('msg').textContent='GOOD!  MULTIPLIER ×'+mult;flashIt('good');setTimeout(newShape,120)}function fail(){clearTimeout(timer);flashIt('bad');$('game').classList.add('hide');$('over').classList.remove('hide');$('scoreline').textContent='SCORE '+score;$('result').textContent=score>=best?'NEW BEST!':'BEST: '+best}piece.addEventListener('pointerdown',e=>{dragging=true;piece.setPointerCapture(e.pointerId);piece.style.zIndex=30});piece.addEventListener('pointermove',e=>{if(!dragging)return;const a=arena.getBoundingClientRect();let x=e.clientX-a.left-piece.offsetWidth/2,y=e.clientY-a.top-piece.offsetHeight/2;x=Math.max(0,Math.min(arena.clientWidth-piece.offsetWidth,x));y=Math.max(0,Math.min(arena.clientHeight-piece.offsetHeight,y));piece.style.left=x+'px';piece.style.top=y+'px'});piece.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;piece.style.zIndex=10;if(inTarget())success();else fail()});$('start').onclick=startGame;$('again').onclick=startGame;$('home').onclick=()=>{clearTimeout(timer);$('over').classList.add('hide');$('game').classList.add('hide');$('menu').classList.remove('hide');$('best').textContent='BEST: '+best}})();</script></body></html>
