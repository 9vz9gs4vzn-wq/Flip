<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FLIP 0.2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707;color:#fff;font-family:Arial,sans-serif}
#menu,#game,#over{position:fixed;inset:0}
#menu,#over{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#menu{background:radial-gradient(circle,#222,#050505)}
h1{font-size:22vw;margin:0;letter-spacing:.08em;text-shadow:4px 4px 0 #555}
.sub{color:#aaa;letter-spacing:.25em;font-size:12px}
button{width:min(86vw,340px);padding:17px;margin:14px 0;border:1px solid #777;border-radius:12px;background:#151515;color:#fff;font-size:18px}
.hide{display:none!important}

#game{background:#0a0a0a}
#hud{position:absolute;top:18px;left:0;width:100%;display:flex;justify-content:space-around;z-index:8;font-size:12px;letter-spacing:.1em}
#rule{position:absolute;top:60px;left:5%;right:5%;text-align:center;font-size:20px;font-weight:700;letter-spacing:.08em;z-index:8}
#timerWrap{position:absolute;top:102px;left:8%;right:8%;height:5px;background:#222;border-radius:6px;overflow:hidden;z-index:8}
#timerBar{height:100%;width:100%;background:#ddd;transform-origin:left center}
#arena{position:absolute;left:5%;right:5%;top:19%;bottom:8%;border:1px solid #2c2c2c;border-radius:18px;overflow:hidden}
.target{position:absolute;width:82px;height:82px;display:flex;align-items:center;justify-content:center;color:transparent;font-size:0;transition:all .18s}
.target svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.target svg *{fill:none;stroke:#8a8a8a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1.8 5.2}
.target.hiddenLabel svg{opacity:0}
.target.flash svg *{stroke:#bbb}
#t0{left:3%;top:4%}#t1{right:3%;top:4%}#t2{left:3%;bottom:4%}#t3{right:3%;bottom:4%}
.target.hiddenLabel::before{opacity:0}
.target.flash{border-color:#aaa;transform:scale(1.04)}
.piece{position:absolute;width:68px;height:68px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 22px #fff3;z-index:10;touch-action:none;user-select:none}
.piece.circle{border-radius:50%}
.piece.triangle{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.piece.decoy{filter:blur(.25px)}
#msg{position:absolute;bottom:2%;width:100%;text-align:center;color:#777;font-size:11px}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:20}
#flash.good{background:#fff;opacity:.10}
#flash.bad{background:#f00;opacity:.22}
#flash.glitch{background:#fff;opacity:.05;animation:g .15s steps(2) 4}
@keyframes g{50%{transform:translateX(5px)}}
#game.reverseMode{background:#1b0606}
#game.reverseMode #arena{border-color:#8a2525;box-shadow:inset 0 0 42px #8a000044}
#game.reverseMode #rule{color:#ff6969;text-shadow:0 0 14px #f0000088}
#game.reverseMode #timerBar{background:#ff6969}
#reverseIntro{position:absolute;inset:0;z-index:25;background:#170000f5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
#reverseIntro h3{font-size:11vw;margin:0 0 16px;color:#ff6969;letter-spacing:.08em}
#reverseIntro p{font-size:18px;line-height:1.45;margin:4px 0}.example{font-size:22px;line-height:1.6;margin-top:12px}
#reverseIntro.hide{display:none!important}
#over{background:#050505ee;z-index:30}
#over h2{font-size:12vw;margin:0 0 10px}
#scoreline{font-size:24px}
#tip{color:#999;max-width:320px;line-height:1.45}
</style>
</head>
<body>

<section id="menu">
<h1>FLIP</h1>
<div class="sub">1.1 • ADAPTIVE DECOYS</div>
<p>Rules change. Targets move. Decoys appear.<br>Stay sharp.</p>
<button id="start">PLAY</button>
<div id="best"></div>
</section>

<section id="game" class="hide">
<div id="hud">
<span>SCORE <b id="score">0</b></span>
<span>×<b id="mult">1</b></span>
<span>BEST <b id="best2">0</b></span>
</div>
<div id="rule">MATCH THE SHAPE</div>
<div id="timerWrap"><div id="timerBar"></div></div>
<div id="arena">
<div class="target" id="t0" data-shape="circle"><svg viewBox="0 0 82 82" aria-hidden="true"><circle cx="41" cy="41" r="34"/></svg></div>
<div class="target" id="t1" data-shape="square"><svg viewBox="0 0 82 82" aria-hidden="true"><rect x="9" y="9" width="64" height="64" rx="5"/></svg></div>
<div class="target" id="t2" data-shape="triangle"><svg viewBox="0 0 82 82" aria-hidden="true"><polygon points="41,7 74,72 8,72"/></svg></div>
<div class="target" id="t3" data-shape="star"><svg viewBox="0 0 82 82" aria-hidden="true"><polygon points="41,7 50,30 75,31 55,47 62,72 41,58 20,72 27,47 7,31 32,30"/></svg></div>
</div>
<div id="msg">DRAG FAST</div>
<div id="flash"></div>
<div id="reverseIntro" class="hide"><h3>REVERSE!</h3><p>Do <b>NOT</b> put the shape in its matching target.</p><div class="example">● → ✕ CIRCLE<br>● → ✓ ANY OTHER TARGET</div></div>
</section>

<section id="over" class="hide">
<h2>GAME OVER</h2>
<div id="scoreline">SCORE 0</div>
<p id="result"></p>
<p id="tip"></p>
<button id="again">PLAY AGAIN</button>
<button id="home">MENU</button>
</section>

<script>
(()=> {
const $=id=>document.getElementById(id);
const arena=$('arena'),flash=$('flash'),rule=$('rule'),timerBar=$('timerBar');
let score=0,mult=1,best=Number(localStorage.getItem('flipBestHard')||0);
let roundToken=0,active=[],timer=null,roundStart=0,roundLimit=2200,mode='match',mainSpawn=null;
let targetMap=['circle','square','triangle','star'];
let reverseSeen=false,paused=false,memoryHideOnTouch=false;

const shapes=[
 {name:'circle',label:'●'},
 {name:'square',label:'■'},
 {name:'triangle',label:'▲'},
 {name:'star',label:'★'}
];

$('best').textContent='BEST: '+best;
$('best2').textContent=best;

function symbolFor(shape){return shape==='circle'?'●':shape==='square'?'■':shape==='triangle'?'▲':'★';}
function renderTarget(t,shape){
 t.dataset.shape=shape;
 if(shape==='circle'){
   t.innerHTML='<svg viewBox="0 0 82 82" aria-hidden="true"><circle cx="41" cy="41" r="34"/></svg>';
 }else if(shape==='square'){
   t.innerHTML='<svg viewBox="0 0 82 82" aria-hidden="true"><rect x="9" y="9" width="64" height="64" rx="5"/></svg>';
 }else if(shape==='triangle'){
   t.innerHTML='<svg viewBox="0 0 82 82" aria-hidden="true"><polygon points="41,7 74,72 8,72"/></svg>';
 }else{
   t.innerHTML='<svg viewBox="0 0 82 82" aria-hidden="true"><polygon points="41,7 50,30 75,31 55,47 62,72 41,58 20,72 27,47 7,31 32,30"/></svg>';
 }
}
function targetIdFor(shape){
 const idx=targetMap.indexOf(shape);
 return 't'+idx;
}
function clearPieces(){
 active.forEach(o=>o.el.remove());
 active=[];
}
function shuffleTargets(){
 targetMap.sort(()=>Math.random()-.5);
 for(let i=0;i<4;i++){
   const t=$('t'+i);
   renderTarget(t,targetMap[i]);
   t.classList.add('flash');
   setTimeout(()=>t.classList.remove('flash'),180);
 }
}
function chooseMode(){
 if(score<6) return 'match';
 const r=Math.random();
 if(score>=18 && r<.22) return 'reverse';
 if(score>=10 && r<.42) return 'memory';
 return 'match';
}
function randomPos(avoidMain=false){
 const maxX=Math.max(20,arena.clientWidth-100);
 const maxY=Math.max(120,arena.clientHeight-110);
 let pos=null,tries=0;
 do{
   pos={
     x:20+Math.random()*Math.max(10,maxX-20),
     y:120+Math.random()*Math.max(10,maxY-120)
   };
   tries++;
 }while(
   avoidMain && mainSpawn && tries<80 &&
   Math.abs(pos.x-mainSpawn.x)<125 &&
   Math.abs(pos.y-mainSpawn.y)<125
 );
 return pos;
}
function makePiece(shape,decoy=false){
 const el=document.createElement('div');
 el.className='piece '+shape.name+(decoy?' decoy':'');
 el.textContent=shape.label;
 if(decoy){
   const decoyOpacity=Math.min(.92,.30+score*.0125);
   el.style.opacity=decoyOpacity.toFixed(2);
 }
 const pos=randomPos(decoy);
 el.style.left=pos.x+'px'; el.style.top=pos.y+'px';
 arena.appendChild(el);

 if(!decoy) mainSpawn={x:pos.x,y:pos.y};
 const obj={el,shape:shape.name,decoy,dragging:false};
 active.push(obj);

 el.addEventListener('pointerdown',e=>{
   if(decoy){ fail('You grabbed a decoy.'); return; }
   if(mode==='memory' && memoryHideOnTouch){
     memoryHideOnTouch=false;
     document.querySelectorAll('.target').forEach(t=>t.classList.add('hiddenLabel'));
     rule.textContent='MATCH FROM MEMORY';
   }
   obj.dragging=true;
   el.setPointerCapture(e.pointerId);
   el.style.zIndex=25;
 });
 el.addEventListener('pointermove',e=>{
   if(!obj.dragging)return;
   const a=arena.getBoundingClientRect();
   let x=e.clientX-a.left-el.offsetWidth/2;
   let y=e.clientY-a.top-el.offsetHeight/2;
   x=Math.max(0,Math.min(arena.clientWidth-el.offsetWidth,x));
   y=Math.max(0,Math.min(arena.clientHeight-el.offsetHeight,y));
   el.style.left=x+'px';el.style.top=y+'px';
 });
 el.addEventListener('pointerup',()=>{
   if(!obj.dragging)return;
   obj.dragging=false;el.style.zIndex=10;
   checkDrop(obj);
 });
}
function overlapTarget(el,target){
 const a=el.getBoundingClientRect(),b=target.getBoundingClientRect();
 const x=a.left+a.width/2,y=a.top+a.height/2;
 const pad=10; // invisible forgiving hitbox, same rectangular shape for every target
 return x>(b.left-pad)&&x<(b.right+pad)&&y>(b.top-pad)&&y<(b.bottom+pad);
}
function checkDrop(obj){
 const correctId=targetIdFor(obj.shape);
 let chosen=null;
 for(let i=0;i<4;i++) if(overlapTarget(obj.el,$('t'+i))) chosen='t'+i;

 if(!chosen){fail('Missed the target.');return;}

 if(mode==='reverse'){
   if(chosen===correctId){fail('Rule was REVERSE.');return;}
   success();
 }else{
   if(chosen!==correctId){fail('Wrong target.');return;}
   success();
 }
}
function updateDifficulty(){
 roundLimit = Math.max(900,
  score<=10 ? 2600-score*35 :
  score<=20 ? 2250-(score-10)*30 :
  score<=30 ? 1950-(score-20)*25 :
  score<=40 ? 1700-(score-30)*25 :
  1450-(score-40)*18
);
 mult=1+Math.floor(score/5);
 $('mult').textContent=mult;
}
function success(){
 clearTimeout(timer);
 score++;
 $('score').textContent=score;
 if(score>best){best=score;localStorage.setItem('flipBestHard',best);$('best2').textContent=best}
 flashIt('good');
 if(score===6||score===12||score===20) shuffleTargets();
 setTimeout(newRound,100);
}
function flashIt(type){
 flash.className='';
 void flash.offsetWidth;
 flash.className=type;
 setTimeout(()=>flash.className='',130);
}
function fail(reason){
 if(paused)return;
 clearTimeout(timer);
 flashIt('bad');
 clearPieces();
 $('game').classList.add('hide');
 $('over').classList.remove('hide');
 $('scoreline').textContent='SCORE '+score;
 $('result').textContent=score>=best?'NEW BEST!':'BEST: '+best;
 $('tip').textContent=reason||'Too slow.';
}
function newRound(){
 roundToken++;
 clearTimeout(timer);
 clearPieces();
 mainSpawn=null;
 updateDifficulty();
 memoryHideOnTouch=false;
 mode=chooseMode();
 $('game').classList.toggle('reverseMode',mode==='reverse');

 if(score>=14 && Math.random()<.34) shuffleTargets();

 document.querySelectorAll('.target').forEach(t=>t.classList.remove('hiddenLabel'));
 if(mode==='match'){
   rule.textContent='MATCH THE SHAPE';
 }else if(mode==='reverse'){
   rule.textContent=reverseSeen?'REVERSE!':'NEW RULE: REVERSE!';
 }else{
   memoryHideOnTouch=true;
   rule.textContent='MEMORISE THE TARGETS';
 }

 const main=shapes[Math.floor(Math.random()*shapes.length)];
 makePiece(main,false);

 // Decoys become more frequent and more numerous as the score climbs.
 // ~25% chance at score 8, ~55% at 20, ~80% at 30+, plus extra decoys later.
 if(score>=8){
   const chance1=Math.min(.82,.25+(score-8)*.025);
   if(Math.random()<chance1){
     let d=shapes[Math.floor(Math.random()*shapes.length)];
     makePiece(d,true);
   }
 }
 if(score>=18){
   const chance2=Math.min(.68,.12+(score-18)*.022);
   if(Math.random()<chance2){
     let d=shapes[Math.floor(Math.random()*shapes.length)];
     makePiece(d,true);
   }
 }
 if(score>=32){
   const chance3=Math.min(.48,.08+(score-32)*.018);
   if(Math.random()<chance3){
     let d=shapes[Math.floor(Math.random()*shapes.length)];
     makePiece(d,true);
   }
 }

 const tok=roundToken;
 function beginTimedRound(){
   paused=false; roundStart=performance.now();
   function animateTimer(){
     if(tok!==roundToken||paused)return;
     const p=Math.max(0,1-(performance.now()-roundStart)/roundLimit);
     timerBar.style.transform='scaleX('+p+')';
     if(p>0) requestAnimationFrame(animateTimer);
   }
   requestAnimationFrame(animateTimer);
   timer=setTimeout(()=>fail('Too slow.'),roundLimit);
 }
 if(mode==='reverse'&&!reverseSeen){
   reverseSeen=true; paused=true; timerBar.style.transform='scaleX(1)';
   $('reverseIntro').classList.remove('hide');
   setTimeout(()=>{$('reverseIntro').classList.add('hide');beginTimedRound()},2000);
 } else beginTimedRound();
 if(score>=10 && Math.random()<.18) flashIt('glitch');
}
function startGame(){
 $('menu').classList.add('hide');
 $('over').classList.add('hide');
 $('game').classList.remove('hide');
 score=0;mult=1;reverseSeen=false;paused=false;memoryHideOnTouch=false;targetMap=['circle','square','triangle','star'];
 for(let i=0;i<4;i++) renderTarget($('t'+i),targetMap[i]);
 $('score').textContent=0;$('mult').textContent=1;$('best2').textContent=best;
 newRound();
}
$('start').onclick=startGame;
$('again').onclick=startGame;
$('home').onclick=()=>{
 clearTimeout(timer);clearPieces();
 $('over').classList.add('hide');$('game').classList.add('hide');$('menu').classList.remove('hide');
 $('best').textContent='BEST: '+best;
};
})();
</script>
</body>
</html>
